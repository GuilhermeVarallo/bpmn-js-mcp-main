# nginx na frente do bpmn-js-mcp: única fonte dos cabeçalhos de segurança
# (pentest ESI/FGV, achados 01–05, 08, 09) e proxy do MCP Streamable HTTP.
#
# Regras que já causaram bug real em outras aplicações (MMP, TAC2):
#   - todo add_header fica no bloco server, sempre com `always` (sem ele os
#     cabeçalhos somem nas respostas de erro, e o scanner testa erros);
#   - NENHUM add_header dentro de location: um só apaga, em silêncio, todos os
#     herdados do server;
#   - nada de `expires` (emite um segundo Cache-Control);
#   - cada cabeçalho sai uma vez só — por isso o proxy_hide_header abaixo, e por
#     isso o F5/balanceador na frente NÃO deve injetar os mesmos cabeçalhos.

worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    server_tokens off;
    access_log /dev/stdout;

    # Imagem não-root: diretórios temporários graváveis em /tmp.
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    default_type application/json;
    charset utf-8;

    # Igual a MCP_MAX_BODY_BYTES do app (4 MB).
    client_max_body_size 4m;

    upstream bpmn_mcp {
        server app:3000;
        keepalive 16;
    }

    server {
        listen 8080;
        server_name _;

        # ── Cabeçalhos de segurança (todos aqui, todos com always) ──────────
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
        # Só API (JSON/SSE), nenhuma página HTML: a base mínima da regra basta.
        add_header Content-Security-Policy "default-src 'self'; object-src 'none'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;
        # Tudo aqui é API: nada de cache, inclusive nos erros.
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;

        # O SDK do MCP põe Cache-Control: no-cache no SSE; sem isto sairiam dois.
        proxy_hide_header Cache-Control;
        proxy_hide_header Pragma;
        proxy_hide_header Expires;
        proxy_hide_header X-Powered-By;

        # ── Proxy (no server para valer em todas as locations) ───────────────
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # SSE: entregar cada evento na hora, e aguentar ferramenta demorada.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;

        location = /mcp {
            proxy_pass http://bpmn_mcp;
        }

        location = /health {
            proxy_pass http://bpmn_mcp;
        }

        location / {
            return 404 '{"error":"Not found"}';
        }
    }
}
